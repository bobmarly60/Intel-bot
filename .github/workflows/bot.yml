name: Intel Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests feedparser cloudscraper
      - run: python main.py
      - run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add .
          git commit -m "update" || exit 0
          git push
